[package]
name = "aurelin"
version = "0.4.2"
edition = "2024"
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["starters/*/dist/**", "starters/*/node_modules/**"]

[[bin]]
name = "aurelin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
include_dir = "0.7"
rand = "0.9"
toml_edit = "0.25"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
