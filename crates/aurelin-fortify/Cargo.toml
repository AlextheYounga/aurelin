[package]
name = "aurelin-fortify"
version = "0.3.1"
edition = "2024"
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aurelin-framework = { version = "0.3.1", path = "../aurelin-framework" }
aurelin-passkeys = { version = "0.3.1", path = "../aurelin-passkeys" }
axum-login = "0.18"
axum-tower-sessions-csrf = "=0.1.1"
axum-valid = "0.25"
constant_time_eq = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
totp-rs = { version = "6.0", features = ["gen_secret", "otpauth", "qr", "zeroize"] }
tower-sessions = "0.14"
tracing = "0.1"
urlencoding = "2"
validator = { version = "0.20", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
