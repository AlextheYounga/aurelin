[package]
name = "aurelin-fortify"
version = "0.1.0"
edition = "2024"

[dependencies]
aurelin-framework = { path = "../aurelin-framework" }
aurelin-passkeys = { path = "../aurelin-passkeys" }
constant_time_eq = "0.4"
rand = "0.9"
thiserror = "2"
totp-rs = { version = "6.0", features = ["gen_secret", "otpauth", "qr", "zeroize"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
