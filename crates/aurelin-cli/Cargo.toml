[package]
name = "aurelin-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aurelin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
include_dir = "0.7"
toml_edit = "0.25"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
