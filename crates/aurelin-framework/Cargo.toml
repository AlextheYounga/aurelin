[package]
name = "aurelin-framework"
version = "0.3.2"
edition = "2024"
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[features]
leptos = ["dep:axum-tower-sessions-csrf", "dep:constant_time_eq", "dep:leptos_axum"]

[dependencies]
aes-gcm = "0.10"
apalis = "=1.1.1"
apalis-sqlite = "=1.1.1"
axum = "0.8"
axum-tower-sessions-csrf = { version = "=0.1.1", optional = true }
base64 = "0.22"
bcrypt = "0.17"
config = { version = "0.15", default-features = false }
constant_time_eq = { version = "0.4", optional = true }
dotenvy = "0.15"
hmac = "0.12"
hkdf = "0.12"
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
leptos_axum = { version = "0.8.8", optional = true }
inertia_rs = { version = "0.4", default-features = false, features = ["axum"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sea-orm = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.10"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tower-sessions = "0.14"
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
