[package]
name = "aurelin-framework"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
config = { version = "0.15", default-features = false }
dotenvy = "0.15"
inertia_rs = { version = "0.4", default-features = false, features = ["axum"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
