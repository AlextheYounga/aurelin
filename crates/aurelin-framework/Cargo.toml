[package]
name = "aurelin-framework"
version = "0.1.0"
edition = "2024"
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
bcrypt = "0.17"
config = { version = "0.15", default-features = false }
dotenvy = "0.15"
hmac = "0.12"
hkdf = "0.12"
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
inertia_rs = { version = "0.4", default-features = false, features = ["axum"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tower-sessions = "0.14"
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
