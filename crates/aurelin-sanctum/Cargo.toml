[package]
name = "aurelin-sanctum"
version = "0.3.3"
edition = "2024"
authors.workspace = true
description = "Personal access token primitives for Aurelin"
license.workspace = true
repository.workspace = true

[dependencies]
aurelin-framework = { version = "0.3.3", path = "../aurelin-framework" }
axum = "0.8"
constant_time_eq = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
url = "2"

[dev-dependencies]
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-json"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
